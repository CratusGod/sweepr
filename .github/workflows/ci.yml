name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm rust gcc git base-devel cargo-llvm-cov llvm shellcheck sudo
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck install.sh
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      # Run as a normal user, the way sweepr itself runs. Arch's rust is built
      # on the system LLVM, so use its tools instead of rustup's llvm-tools.
      - name: Test with coverage
        run: |
          useradd -m tester
          chown -R tester .
          su tester -c 'LLVM_COV=/usr/bin/llvm-cov LLVM_PROFDATA=/usr/bin/llvm-profdata cargo llvm-cov --locked --fail-under-lines 80'
      - name: Validate systemd units
        run: |
          for u in systemd/*; do sed "s#/usr/bin/sweepr#/usr/bin/true#" "$u" > "/tmp/$(basename "$u")"; done
          systemd-analyze verify /tmp/sweepr*.service /tmp/sweepr*.timer
      # The real install script, on this commit instead of main.
      - name: Install with install.sh
        run: |
          echo 'tester ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/tester
          su tester -c 'SWEEPR_SRC="$PWD" SWEEPR_REF="$(git rev-parse HEAD)" bash install.sh'
          sweepr --version
          # The archlinux image never extracts man pages (NoExtract), so ask pacman.
          pacman -Qlq sweepr | grep -qx /usr/share/man/man1/sweepr.1.gz
